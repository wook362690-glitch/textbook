<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교과서 제작 공정판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 탭 바 + 단일 작업 영역. 인쇄 교정지처럼 차가운 종이 바탕에 공정 시안(cyan)을 강조색으로, 지연은 교정용 빨간 펜 색으로 표시 */
:root {
  --paper: #f5f7fa;
  --surface: #ffffff;
  --sunken: #edf0f4;
  --ink: #16202c;
  --ink-2: #4c5869;
  --ink-3: #7a8596;
  --line: #dce1e8;
  --cyan: #08769b;
  --cyan-soft: #e1f0f6;
  --ok: #2c8653;
  --warn: #a86d12;
  --crit: #c4303a;
  --wait: #c9d0da;
  --font-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --sunken: #1d2631; --ink: #e5eaf1; --ink-2: #a3aebd; --ink-3: #75808f;
    --line: #2a3441; --cyan: #4db6da; --cyan-soft: #15303c; --ok: #5dc28b; --warn: #e2a84b; --crit: #ef6a72; --wait: #3a4553;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d26; --sunken: #1d2631; --ink: #e5eaf1; --ink-2: #a3aebd; --ink-3: #75808f;
  --line: #2a3441; --cyan: #4db6da; --cyan-soft: #15303c; --ok: #5dc28b; --warn: #e2a84b; --crit: #ef6a72; --wait: #3a4553;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 14px/1.6 var(--font-body); margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: 18px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: .08em; color: var(--ink-3); font-weight: 500; }
.muted { color: var(--ink-2); }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1180px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-wrap: wrap; align-items: end; gap: 8px 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
.reg { width: 18px; height: 18px; flex: none; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px 11px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--cyan); }
.tab:hover { color: var(--ink); }

main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
.notice { font-size: 12.5px; color: var(--ink-2); background: var(--sunken); border-radius: var(--radius); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; }
.link-btn { border: 0; background: none; color: var(--cyan); padding: 0; text-decoration: underline; text-underline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel > h3 { margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }

/* 요약 수치 */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font: 600 28px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--ink-2); font-size: 13px; }
.kpi.crit .v { color: var(--crit); }
.kpi.warn .v { color: var(--warn); }

/* 단계 분포 막대 */
.dist { display: grid; grid-template-columns: max-content 1fr 2.5em; gap: 6px 12px; align-items: center; }
.dist .n { font-size: 13px; color: var(--ink-2); }
.dist .track { height: 14px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.dist .fill { height: 100%; background: var(--cyan); border-radius: 3px; }
.dist .c { text-align: right; }

/* 상태 표시 */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-완료 { color: var(--ok); } .s-진행 { color: var(--cyan); } .s-보류 { color: var(--warn); } .s-반려 { color: var(--crit); } .s-대기 { color: var(--ink-3); }
.h-지연 { color: var(--crit); } .h-위험 { color: var(--warn); } .h-정상 { color: var(--ok); }
.c-허락완료 { color: var(--ok); } .c-협의중 { color: var(--warn); } .c-미처리 { color: var(--crit); }

.list { display: grid; }
.row-btn { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 2px; }
.row-btn:first-child { border-top: 0; }
.row-btn:hover .t { color: var(--cyan); }
.row-btn .t { font-weight: 500; }
.row-btn .sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.empty { color: var(--ink-3); padding: 8px 2px; }

/* 공정 맵 */
.flow { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; counter-reset: st; }
.stage-card { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-height: 108px; }
.stage-card:hover { border-color: var(--cyan); }
.stage-card[aria-pressed="true"] { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); background: var(--cyan-soft); }
.stage-card .no { font: 500 12px var(--font-mono); color: var(--ink-3); }
.stage-card .nm { font: 600 16px var(--font-display); }
.stage-card .meta { font-size: 12.5px; color: var(--ink-2); }
.stage-card .loop { font-size: 12px; color: var(--warn); }
.stage-card .cnt { position: absolute; top: 10px; right: 12px; font: 500 12px var(--font-mono); color: var(--cyan); }
.detail { display: grid; gap: 14px; }
.detail dl { display: grid; grid-template-columns: 7em 1fr; gap: 8px 14px; margin: 0; }
.detail dt { color: var(--ink-3); font-size: 13px; }
.detail dd { margin: 0; min-width: 0; }
.detail ul { margin: 0; padding-left: 1.1em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sunken); border-radius: 4px; padding: 2px 8px; font-size: 13px; }
button.chip:hover { border-color: var(--cyan); color: var(--cyan); }

/* 필터·표 */
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
.field { display: grid; gap: 3px; font-size: 12px; color: var(--ink-3); }
.field select, .field input { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 8px; font-size: 13.5px; color: var(--ink); min-width: 120px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--sunken); }
tbody tr.clickable:hover .t { color: var(--cyan); }
.t { font-weight: 500; }
.segs { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; width: 176px; }
.seg { height: 10px; border-radius: 2px; background: var(--wait); }
.seg.완료 { background: var(--ok); } .seg.진행 { background: var(--cyan); } .seg.보류 { background: var(--warn); } .seg.반려 { background: var(--crit); }
.seg-label { font-size: 12px; color: var(--ink-2); margin-top: 3px; }

/* 교과서 상세 */
.back { border: 0; background: none; color: var(--cyan); padding: 0; justify-self: start; }
.head-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); font-size: 13px; }
.stepper { display: grid; grid-template-columns: repeat(11, minmax(64px, 1fr)); gap: 4px; min-width: 740px; }
.step { display: grid; gap: 6px; font-size: 12px; text-align: center; color: var(--ink-2); }
.step .bar { height: 6px; border-radius: 3px; background: var(--wait); }
.step.완료 .bar { background: var(--ok); } .step.진행 .bar { background: var(--cyan); } .step.보류 .bar { background: var(--warn); } .step.반려 .bar { background: var(--crit); }
.step.cur { color: var(--ink); font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 12px; font-size: 13.5px; }
.btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--cyan); border-color: var(--cyan); color: var(--surface); }
.btn.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }
.saved { font-size: 12.5px; color: var(--ok); }

/* 간트 */
.gantt { display: grid; grid-template-columns: 7.5em 1fr; gap: 6px 10px; min-width: 700px; align-items: center; font-size: 12.5px; }
.gantt .lane { position: relative; height: 22px; background: var(--sunken); border-radius: 3px; }
.gantt .plan { position: absolute; top: 3px; height: 7px; border-radius: 2px; background: var(--wait); }
.gantt .act { position: absolute; top: 12px; height: 7px; border-radius: 2px; background: var(--ok); }
.gantt .act.진행 { background: var(--cyan); } .gantt .act.보류 { background: var(--warn); } .gantt .act.반려 { background: var(--crit); }
.gantt .today { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--crit); }
.gantt .axis { position: relative; height: 18px; font: 11px var(--font-mono); color: var(--ink-3); }
.gantt .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 14px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

@media (max-width: 560px) {
  .detail dl { grid-template-columns: 1fr; gap: 2px; }
  .detail dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill, .seg, .step .bar { transition: background-color .2s, width .3s; }
}
</style>
</head>

// ─── 날짜 ───
const DAY = 86400000;
const today = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const add = (d, n) => new Date(d.getTime() + n * DAY);
const diff = (a, b) => Math.round((a - b) / DAY);
const fmt = d => d ? `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}` : '–';
const fmtYM = d => `${String(d.getFullYear()).slice(2)}.${String(d.getMonth() + 1).padStart(2, '0')}`;

// 현재 단계의 계획 종료일을 기준으로 앞뒤 단계 계획 일정을 만든다
function buildPlan(seed, idx) {
  const plan = [];
  let end = parse(seed.end);
  plan[seed.stage] = { start: add(end, -STAGES[seed.stage].days), end };
  for (let i = seed.stage - 1; i >= 0; i--) plan[i] = { start: add(plan[i + 1].start, -STAGES[i].days), end: plan[i + 1].start };
  for (let i = seed.stage + 1; i < STAGES.length; i++) plan[i] = { start: plan[i - 1].end, end: add(plan[i - 1].end, STAGES[i].days) };
  // 실제 일정: 계획 대비 조금씩 밀리거나 당겨진 예시 값
  plan.forEach((p, i) => { p.slip = ((i * 7 + idx * 3) % 13) - 4; });
  return plan;
}

const STORE_KEY = 'textbook-process-v1';
function loadOverrides() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
function saveOverrides(o) { try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); return true; } catch { return false; } }
let overrides = loadOverrides();

const BOOKS = SEED.map((s, i) => ({ ...s, plan: buildPlan(s, i) }));

function state(book) {
  const o = overrides[book.id] || {};
  const stage = o.stage ?? book.stage;
  const status = o.status ?? book.status;
  const stages = STAGES.map((def, i) => {
    const p = book.plan[i];
    const st = i < stage ? '완료' : i === stage ? status : '대기';
    const actStart = i <= stage ? add(p.start, p.slip) : null;
    const actEnd = i < stage ? add(p.end, p.slip) : null;
    return { i, def, st, plan: p, actStart, actEnd };
  });
  const cur = stages[stage];
  const left = diff(cur.plan.end, today);
  let health = '정상';
  if (left < 0) health = '지연';
  else if (left < STAGES[stage].days * 0.2) health = '위험';
  return { stage, status, stages, cur, left, health };
}

    <div class="legend"><span><i style="background:var(--wait)"></i>계획</span><span><i style="background:var(--ok)"></i>실제(완료)</span><span><i style="background:var(--cyan)"></i>실제(진행 중)</span><span><i style="border-left:1.5px dashed var(--crit);border-radius:0;width:2px"></i>오늘</span></div>
  </section>

  <div class="grid-2">
    <section class="panel">
      <h3>심사 이력</h3>
      ${reviews.length ? `<div class="table-wrap"><table><thead><tr><th>차수</th><th>결과</th><th>일자</th></tr></thead><tbody>${reviews.map(r => `
        <tr><td>${r.round}${r.note ? `<div class="seg-label">${r.note}</div>` : ''}</td><td>${pill(r.result, r.result === '조건부 합격' ? 'h-위험' : 'h-정상')}</td><td class="mono">${fmt(r.date)}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="empty">아직 검정 심사 단계에 이르지 않았습니다.</p>'}
    </section>
    <section class="panel">
      <h3>저작권</h3>
      <div class="facts" style="margin-bottom:10px">${pill(`허락 완료 ${cp.허락완료}`, 'c-허락완료')} ${pill(`협의 중 ${cp.협의중}`, 'c-협의중')} ${pill(`미처리 ${cp.미처리}`, 'c-미처리')}</div>
      ${COPYRIGHT.filter(c => c.book === b.id).length ? `<button class="link-btn" data-go="copyright" data-cpbook="${b.id}">이 교과서의 저작권 항목 보기</button>` : '<p class="empty">등록된 저작권 항목이 없습니다.</p>'}
    </section>
  </div>`;
}

// ─── 저작권 ───
const cpFilter = { book: '', status: '' };
function viewCopyright() {
  const rows = COPYRIGHT.filter(c => (!cpFilter.book || c.book === cpFilter.book) && (!cpFilter.status || c.status === cpFilter.status));
  const expiring = COPYRIGHT.filter(c => c.until && diff(parse(c.until), today) <= 90);
  const opt = (v, label, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${label}</option>`;
  const statusLabel = { 허락완료: '허락 완료', 협의중: '협의 중', 미처리: '미처리' };
  return `${notice}
  ${expiring.length ? `<section class="panel"><h3>90일 안에 만료되는 사용 허락</h3><div class="list">${expiring.map(c => `
    <button class="row-btn" data-book="${c.book}"><span class="t">${esc(c.item)}</span><span class="mono h-위험">${fmt(parse(c.until))}</span>
    <span class="sub">${esc(bookById(c.book).title)} · ${esc(c.holder)} · ${diff(parse(c.until), today)}일 남음</span></button>`).join('')}</div></section>` : ''}
  <div class="filters">
    <label class="field">교과서<select id="cp-book">${opt('', '전체', cpFilter.book)}${BOOKS.filter(b => COPYRIGHT.some(c => c.book === b.id)).map(b => opt(b.id, b.title, cpFilter.book)).join('')}</select></label>
    <label class="field">처리 상태<select id="cp-status">${opt('', '전체', cpFilter.status)}${Object.keys(statusLabel).map(k => opt(k, statusLabel[k], cpFilter.status)).join('')}</select></label>
  </div>
  <section class="panel" style="padding:0"><div class="table-wrap"><table>
    <thead><tr><th>자료</th><th>유형</th><th>교과서</th><th>권리자</th><th>상태</th><th style="text-align:right">사용료(원)</th><th>허락 기간</th></tr></thead>
    <tbody>${rows.length ? rows.map(c => `
      <tr class="clickable" data-book="${c.book}" tabindex="0">
        <td><span class="t">${esc(c.item)}</span></td><td>${c.kind}</td><td>${esc(bookById(c.book).title)}</td><td>${esc(c.holder)}</td>
        <td>${pill(statusLabel[c.status], 'c-' + c.status)}</td>
        <td class="num" style="text-align:right">${c.fee ? c.fee.toLocaleString('ko-KR') : '–'}</td>
        <td class="mono">${c.until ? '~ ' + fmt(parse(c.until)) : '–'}</td>
      </tr>`).join('') : '<tr><td colspan="7" class="empty">조건에 맞는 저작권 항목이 없습니다.</td></tr>'}
    </tbody></table></div></section>`;
}

// ─── 라우팅과 이벤트 ───
const app = document.getElementById('app');
function route() {
  const h = location.hash.slice(1) || 'dashboard';
  const view = h.startsWith('book-') ? 'books' : h;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.go === view ? 'page' : 'false'));
  if (h.startsWith('book-')) app.innerHTML = viewBook(h.slice(5));
  else if (h === 'map') app.innerHTML = viewMap();
  else if (h === 'books') app.innerHTML = viewBooks();
  else if (h === 'copyright') app.innerHTML = viewCopyright();
  else app.innerHTML = viewDashboard();
}
function go(hash) {
  savedFlash = '';
  if (location.hash.slice(1) === hash) route(); else location.hash = hash;
  window.scrollTo(0, 0);
}
function refocus(id) { const el = document.getElementById(id); if (el) { el.focus(); if (el.type === 'search') el.setSelectionRange(el.value.length, el.value.length); } }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-book],[data-stage],[data-act]');
  if (!t) return;
  if (t.dataset.cpbook) cpFilter.book = t.dataset.cpbook;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.stage) { selectedStage = +t.dataset.stage; route(); return; }
  if (t.dataset.book && !t.dataset.act) return go('book-' + t.dataset.book);
  const act = t.dataset.act;
  if (act === 'reset') { overrides = {}; saveOverrides(overrides); route(); return; }
  const id = location.hash.slice(6);
  const b = bookById(id); if (!b) return;
  const s = state(b);
  if (act === 'next' || act === 'prev') {
    const stage = s.stage + (act === 'next' ? 1 : -1);
    overrides[id] = { stage, status: '진행' };
    savedFlash = saveOverrides(overrides) ? `${STAGES[stage].name} 단계로 변경했습니다.` : '변경했지만 이 브라우저에 저장하지 못했습니다.';
    route();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-book]')) go('book-' + e.target.dataset.book);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'f-q') { filters.q = e.target.value.trim(); route(); refocus('f-q'); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  const map = { 'f-level': 'level', 'f-type': 'type', 'f-stage': 'stage', 'f-health': 'health' };
  if (map[id]) { filters[map[id]] = e.target.value; route(); refocus(id); }
  if (id === 'cp-book') { cpFilter.book = e.target.value; route(); refocus(id); }
  if (id === 'cp-status') { cpFilter.status = e.target.value; route(); refocus(id); }
  if (id === 'status-sel') {
    const bid = location.hash.slice(6); const s = state(bookById(bid));
    overrides[bid] = { stage: s.stage, status: e.target.value };
    savedFlash = saveOverrides(overrides) ? `상태를 '${e.target.value}'(으)로 변경했습니다.` : '변경했지만 이 브라우저에 저장하지 못했습니다.';
    route(); refocus('status-sel');
  }
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
